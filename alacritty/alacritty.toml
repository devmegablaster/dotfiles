mods = "Command|Alt"

[[keyboard.bindings]]
chars = "\u0002j"
key = "j"
mods = "Command|Alt"

[[keyboard.bindings]]
chars = "\u0002k"
key = "k"
mods = "Command|Alt"

[[keyboard.bindings]]
chars = "\u0002["
key = "I"
mods = "Command"

[cursor.style]
shape = "Beam"

[cursor.vi_mode_style]
shape = "Block"

[env]
TERM = "xterm-256color"
ALACRITTY_DISABLE_WARNINGS = "1"

[font]
# JetBrainsMono = 15
# Terminess = 18
size = 18.5

[font.normal]
# JetBrainsMono Nerd Font
# Terminess Nerd Font
family = "Terminess Nerd Font"

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "buttonless"
opacity = 0.78
blur = true

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 5
y = 5

[keyboard]
